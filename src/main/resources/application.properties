spring.application.name=office-time
server.port=8080

# Data lives in ./data next to wherever the app is started from.
spring.datasource.url=jdbc:h2:file:./data/office-time
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Sign-in is a session cookie. Set SESSION_COOKIE_SECURE=true whenever the app is served over HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=12h
