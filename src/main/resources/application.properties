spring.application.name=office-time
server.port=8080
server.error.include-message=always

# Data lives in ./data next to wherever the app is started from.
spring.datasource.url=jdbc:h2:file:./data/office-time
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
